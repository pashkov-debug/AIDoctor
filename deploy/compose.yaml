# DEPLOY-1: по умолчанию доступ только с localhost ВМ.
# Запуск из корня проекта:
# docker compose --env-file .env.production -f deploy/compose.yaml up -d --build
name: aidoctor-deploy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidoctor
      POSTGRES_DB: aidoctor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidoctor -d aidoctor"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - dbnet

  app:
    image: aidoctor:deploy-1
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://aidoctor:${DB_PASSWORD:?Укажите DB_PASSWORD}@postgres:5432/aidoctor
      ATTACHMENTS_DIR: /opt/aidoctor/data/attachments
      AIDOCTOR_ALLOW_SYNTHETIC_AI_DRAFTS: "0"
      SAFETY_IN_APP_DELIVERY_ENABLED: "false"
      SAFETY_FOLLOWUP_SCAN_ENABLED: "false"
      ATTACHMENT_CLAMD_ENABLED: "false"
    volumes:
      - app_data:/opt/aidoctor/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dbnet
      - webnet

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      AIDOCTOR_DOMAIN: ${AIDOCTOR_DOMAIN:-localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - webnet

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:

networks:
  dbnet:
    internal: true
  webnet:
    internal: false
