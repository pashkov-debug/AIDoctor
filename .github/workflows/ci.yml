name: Проверка AIDoctor

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aidoctor-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Быстрые проверки без PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff — проверка ошибок
        run: python -m ruff check backend

      - name: Ruff — проверка форматирования
        run: python -m ruff format --check backend

      - name: JavaScript — проверка синтаксиса
        run: node --check backend/app/web/assets/app.js

      - name: Python — проверка компиляции
        run: python -m compileall -q backend/app

  full_tests:
    name: Модульные тесты, PostgreSQL и миграции (вручную)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidoctor_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: aidoctor_ci_schema
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U aidoctor_ci -d aidoctor_ci_schema"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://aidoctor_ci:ci_only_password@127.0.0.1:5432/aidoctor_ci_schema
      TEST_DATABASE_URL: postgresql+psycopg://aidoctor_ci:ci_only_password@127.0.0.1:5432/aidoctor_test
      AIDOCTOR_ALLOW_SYNTHETIC_AI_DRAFTS: "0"
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Создать изолированную тестовую БД
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://aidoctor_ci:ci_only_password@127.0.0.1:5432/aidoctor_ci_schema",
              autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE aidoctor_test")
          PY

      - name: Проверка миграций на отдельной БД
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini check

      - name: Модульные и PostgreSQL-тесты
        run: python -m pytest backend/tests -q -rs


  autodeploy:
    name: Автоматическое обновление закрытого VDS
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.VDS_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: aidoctor-vds-test-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VDS_SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
      VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Проверка заполнения Secrets
        shell: bash
        run: |
          test -n "$VDS_SSH_PRIVATE_KEY" || { echo "Нет VDS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VDS_SSH_KNOWN_HOSTS" || { echo "Нет VDS_SSH_KNOWN_HOSTS"; exit 1; }

      - name: Подготовить строгую SSH-проверку сервера
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VDS_SSH_PRIVATE_KEY" > "$HOME/.ssh/aidoctor_actions_deploy"
          printf '%s\n' "$VDS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aidoctor_actions_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -F 185.200.179.238 -f "$HOME/.ssh/known_hosts" >/dev/null ||
            { echo "В known_hosts нет ключа сервера"; exit 1; }

      - name: Обновить AIDoctor на VDS по SHA коммита
        shell: bash
        run: |
          ssh -p 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/aidoctor_actions_deploy" \
            aidoctor-deploy@185.200.179.238 "deploy ${GITHUB_SHA}"
