services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidoctor
      POSTGRES_USER: aidoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidoctor_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aidoctor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidoctor -d aidoctor"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  aidoctor_pgdata:
